license="${mod_license}"
issueTrackerURL="https://github.com/Lightman314/LightmansCurrency/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional
#displayURL="https://change.me.to.your.mods.homepage.example.invalid/"
logoFile="lightman_icon.png"
#credits="Thanks for this example mod goes to Java"
authors="Lightman314" #optional
description='''
Adds a heavily configurable item-based money & shop system to the game.
'''
displayTest="MATCH_VERSION"

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    mandatory=true
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"